<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة الإدارة | إدارة قاعدة البيانات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --text: #f8fafc; --primary: #06b6d4; --border: rgba(255,255,255,0.1); }
        body { background: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; padding: 2rem; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 2rem; }
        .stats { background: rgba(6, 182, 212, 0.1); padding: 1.5rem; border-radius: 1rem; border: 1px solid var(--primary); margin-bottom: 2rem; }
        .sample-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 1rem; padding: 1.5rem; margin-bottom: 1.5rem; }
        .id { font-size: 0.8rem; color: var(--primary); font-family: monospace; }
        .metadata { font-size: 0.9rem; color: #94a3b8; margin: 0.5rem 0; }
        .text { line-height: 1.6; }
        .back-link { color: var(--primary); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>إدارة قاعدة البيانات (ChromaDB)</h1>
        <a href="/" class="back-link">← العودة للرئيسية</a>
    </div>

    <div class="stats">
        <h2>إحصائيات عامة</h2>
        <p>إجمالي عدد المقاطع المخزنة: <strong>{{ data.total_count }}</strong></p>
    </div>

    <h2>آخر 10 عينات في القاعدة:</h2>
    {% for sample in data.samples %}
    <div class="sample-card">
        <div class="id">ID: {{ sample.id }}</div>
        <div class="metadata">المصدر: {{ sample.metadata.url or sample.metadata.source }}</div>
        <div class="text">{{ sample.text[:300] }}...</div>
    </div>
    {% endfor %}
</body>
</html>
